# Render Blueprint: describes the production service as code.
# Docs: docs/06-operations/deployment.md
services:
  - type: web
    name: realtime-chat
    runtime: node
    region: singapore # closest to the Philippines; cannot be changed later
    plan: free
    branch: main
    # The country database (DB-IP, about 8 MB) is downloaded at build time. If the download fails the
    # build still succeeds and every country is simply "unknown".
    buildCommand: npm ci && (npm run geo:update || echo "country database not downloaded") && npm run build
    startCommand: npm start
    healthCheckPath: /health
    autoDeployTrigger: checksPass # deploy only after CI is green on main
    envVars:
      - key: NODE_ENV
        value: production
      - key: TRUST_PROXY_HOPS
        value: "1"
      - key: PREVIEW_BANNER
        value: "true" # until the public launch (M8)
      - key: LOG_LEVEL
        value: info
      - key: COUNTRY_DB_PATH
        value: data/dbip.mmdb # see geo:update
      # The exact https origin of the deployed site. Render asks for this once,
      # when the Blueprint is first applied (it is not stored in this file).
      - key: ALLOWED_ORIGINS
        sync: false
      # Secrets: generated by Render, never committed.
      - key: IP_HASH_SECRET
        generateValue: true
      - key: HEALTH_KEY
        generateValue: true
